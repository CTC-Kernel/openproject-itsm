# Publie l'image Docker prête à l'emploi sur le registre GitHub (GHCR).
# Une stack existante n'a alors plus rien à construire : il lui suffit de
# pointer sur ghcr.io/ctc-kernel/openproject-itsm:16.
name: Publier l'image Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag glissant aligné sur la série OpenProject ciblée par le Dockerfile
            type=raw,value=16
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # amd64 uniquement : la précompilation des assets sous QEMU arm64
          # dépasse les limites des runners GitHub. Pour un hôte arm64,
          # construire localement (docker build -f docker/Dockerfile .).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
